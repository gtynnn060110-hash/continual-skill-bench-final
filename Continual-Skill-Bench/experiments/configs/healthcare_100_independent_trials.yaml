# Independent trials for healthcare-100 subtasks
# Usage:
#   harbor jobs start -c /Users/gtynnn/Documents/Learning/llm_porj/Continual-Skill-Bench/experiments/configs/healthcare_100_independent_trials.yaml

job_name: hc_independent_trials_opus
jobs_dir: ../jobs
n_attempts: 1
timeout_multiplier: 1.0
debug: true

orchestrator:
  type: local
  n_concurrent_trials: 5
  quiet: false
  retry:
    max_retries: 0
    include_exceptions: null
    exclude_exceptions:
      - VerifierTimeoutError
      - BadRequestError
      - RateLimitError
    wait_multiplier: 1.0
    min_wait_sec: 1.0
    max_wait_sec: 60.0
  kwargs: {}

environment:
  type: docker
  import_path: null
  force_build: false
  delete: false
  override_cpus: null
  override_memory_mb: null
  override_storage_mb: null
  override_gpus: null
  kwargs: {}

verifier:
  override_timeout_sec: null
  max_timeout_sec: null
  disable: false

metrics: []

agents:
  - name: claude-code-seq
    import_path: null
    model_name: anthropic/claude-opus-4.7
    override_timeout_sec: null
    override_setup_timeout_sec: null
    max_timeout_sec: null
    kwargs:
      reasoning_effort: medium
      enable_judge_feedback: true
      judge_model: openai/gpt-5.4
      judge_pass_threshold: 0.6
      skill_maintenance_threshold: 0.2
      max_steps_per_task: 30
      max_seconds_per_task: 1200
  # - name: claude-code-seq
  #   import_path: null
  #   model_name: ~anthropic/claude-haiku-latest
  #   override_timeout_sec: null
  #   override_setup_timeout_sec: 1200
  #   max_timeout_sec: null
  #   kwargs: 
  #       reasoning_effort: "medium"
  #       enable_judge_feedback: true
  #       judge_model: openrouter/google/gemini-3.1-pro-preview #must have openrouter prefix, otherwise it will be treated as an anthropic model
  #       judge_pass_threshold: 0.6
  #       skill_maintenance_threshold: 0.2
  #       max_steps_per_task: 30
  #       max_seconds_per_task: 1200  # 20 min wall-clock cap per subtask


